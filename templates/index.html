<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klasyfikacja guzów mózgu</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f2e9e4;
        height: auto;
        width: 100%;
        margin: 0 !important;
        padding: 0 !important;
        font-family: Ubuntu;
        font-size: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      nav {
        background-color: #4a4e69;
        height: 12vh;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0px 0px 5px #2f2f2f;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 999;
      }
      nav img {
        height: 120%;
        padding-top: 10px;
        filter: drop-shadow(0px 0px 2px #f2e9e4);
      }
      .mt-5 {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 25px;
        width: 100%;
      }
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 80%;
      }
      .mb-3 {
        width: 100%;
        text-align: center;
      }
      .btn-primary {
        background-color: #9a8c98;
        border: 2px solid #9a8c98;
        padding: 15px 30px;
        transition: 0.4s all;
        box-shadow: 0px 0px 5px #2f2f2f;
      }
      .btn-primary:hover {
        background-color: #9a8c981c;
        border: 2px solid #9a8c981c;
        color: #2f2f2f;
      }
      .file-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 20px;
        padding-bottom: 150px;
      }
      h5 p {
        font-size: 1rem;
      }
      .file-card {
        background-color: #4a4e69;
        padding: 15px;
        border-radius: 10px;
        width: 200px;
        text-align: center;
        color: #e5e5e5;
        box-shadow: 0px 0px 5px #2f2f2f;
      }
      .file-card img {
        max-width: 100%;
        border-radius: 8px;
      }
      .file-card h5 {
        margin-top: 10px;
      }
      footer {
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        background-color: #4a4e69;
        border-top: 2px solid white;
        padding-left: 20px;
        padding-right: 20px;
        color: #e5e5e5;
      }
      h4 {
        font-size: 16px !important;
        margin: 0px !important;
        padding-top: 10px;
        padding-bottom: 10px;
      }
      h1 {
        margin-top: 150px;
      }
    </style>
  </head>
  <body>
    <nav>
      <img alt="liogo" src="static/images/logo.png" />
    </nav>

    <h1 class="text-center">Klasyfikacja guzów mózgu</h1>
    <form action="/" method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="file" class="form-label">Wgraj zdjęcie mózgu</label>
        <input
          type="file"
          class="form-control"
          id="file"
          name="file"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">WYŚLIJ</button>
    </form>

    <div class="file-container">
      {% for filename in uploaded_files %}
      <div class="file-card">
        <img
          src="{{ url_for('uploaded_file', filename=filename) }}"
          alt="Image preview"
        />
        <h5>
          Model 1:
          <p>
            {{ predictions.get(filename, {}).get('model1', 'No prediction yet')
            }}
          </p>
        </h5>
        <h5>
          Model 2:
          <p>
            {{ predictions.get(filename, {}).get('model2', 'No prediction yet')
            }}
          </p>
        </h5>
      </div>
      {% endfor %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <footer>
      <h4>Szymon Wajs</h4>
      <h4>Mateusz Langaj</h4>
      <h4>Maciej Górny</h4>
    </footer>
  </body>
</html>
